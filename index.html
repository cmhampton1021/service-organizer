<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Group Organizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    header {
      background: #2b6cb0;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }

    header h1 { font-size: 1.3rem; font-weight: 700; }

    .btn-clear {
      background: rgba(255,255,255,.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 6px;
      padding: .4rem .9rem;
      font-size: .85rem;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-clear:hover { background: rgba(255,255,255,.25); }

    main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1.5rem 12rem; }

    /* Add car panel */
    .add-car-panel {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .add-car-panel label { font-weight: 600; font-size: .95rem; white-space: nowrap; }

    .capacity-btns { display: flex; gap: .4rem; flex-wrap: wrap; }

    .capacity-btn {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 6px;
      border: 2px solid #cbd5e0;
      background: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }
    .capacity-btn.selected {
      border-color: #2b6cb0;
      background: #2b6cb0;
      color: #fff;
    }
    .capacity-btn:hover:not(.selected) { border-color: #4299e1; background: #ebf8ff; }

    .btn-primary {
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .55rem 1.2rem;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #2c5282; }
    .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }

    /* Empty state */
    .empty-state {
      text-align: center;
      color: #718096;
      padding: 3rem 1rem;
      font-size: 1rem;
    }

    /* Car cards grid */
    .cars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }

    /* ── All car cards ───────────────────────────────────────────────────── */
    .car-card {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,.18), 0 1px 4px rgba(0,0,0,.12);
    }

    .btn-delete-car {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: 1.4rem;
      line-height: 1;
      padding: .35rem .55rem;
      min-width: 2.5rem;
      min-height: 2.5rem;
      border-radius: 6px;
      transition: color .15s, background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-delete-car:hover { color: #c53030; background: rgba(255,255,255,.15); }

    /* Passenger list inside life card */
    .life-passenger-list { padding: .3rem 1rem .1rem; }
    .passenger-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .3rem 0;
      border-bottom: 1px solid rgba(0,0,0,.06);
      font-size: .9rem;
    }
    .passenger-row:last-child { border-bottom: none; }
    .passenger-name { font-weight: 600; }
    .passenger-count { color: #718096; margin-left: .3rem; }
    .btn-delete-passenger {
      background: none;
      border: none;
      color: #cbd5e0;
      cursor: pointer;
      font-size: 1.2rem;
      padding: .35rem .5rem;
      min-width: 2.5rem;
      min-height: 2.5rem;
      border-radius: 4px;
      transition: color .15s, background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-delete-passenger:hover { color: #c53030; background: #fff5f5; }

    /* Add passenger form */
    .add-passenger-form {
      padding: .6rem 1rem .9rem;
      border-top: 1px solid rgba(0,0,0,.08);
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .add-passenger-form input {
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: .4rem .65rem;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s;
      background: #fff;
    }
    .add-passenger-form input:focus { border-color: #4299e1; }
    .input-name { flex: 1 1 120px; min-width: 100px; }
    .input-count { width: 70px; }
    .btn-add-passenger {
      background: #48bb78;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .4rem .9rem;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-add-passenger:hover { background: #38a169; }
    .form-error {
      width: 100%;
      color: #c53030;
      font-size: .8rem;
      margin-top: .15rem;
    }

    /* ── Game of Life full car ───────────────────────────────────────────── */
    .car-card.is-full {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,.18), 0 1px 4px rgba(0,0,0,.12);
    }

    .life-car-banner {
      position: relative;
      background: #1b2535;
      padding: .6rem .6rem .3rem;
    }

    .life-car-svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
    }

    .btn-delete-car.life-delete {
      position: absolute;
      top: .45rem;
      right: .45rem;
      background: rgba(0,0,0,.3);
      color: rgba(255,255,255,.75);
      border-radius: 5px;
    }
    .btn-delete-car.life-delete:hover { background: rgba(180,0,0,.55); color: #fff; }

    .life-passengers {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem 1.1rem;
      padding: .9rem 1.1rem .75rem;
      justify-content: center;
    }

    .life-family {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .2rem;
    }

    .life-family .btn-delete-passenger {
      font-size: 1rem;
      color: #a0aec0;
      padding: .35rem .5rem;
      min-width: 2.5rem;
      min-height: 2.5rem;
    }
    .life-family .btn-delete-passenger:hover { color: #c53030; background: rgba(197,48,48,.08); }

    .life-pegs {
      display: flex;
      gap: 3px;
      align-items: flex-end;
    }

    .peg-svg { display: block; }

    .life-family-name {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .02em;
      text-align: center;
    }

    .life-car-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: .45rem 1rem;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #fff;
    }

    /* ── Preset cars panel ──────────────────────────────────────────────── */
    .presets-panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      margin-bottom: 1.75rem;
      overflow: hidden;
    }
    .presets-toggle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .85rem 1.25rem;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: border-color .15s;
    }
    .presets-toggle-header.open { border-color: #e2e8f0; }
    .presets-toggle-header h2 { font-size: .95rem; font-weight: 700; color: #2d3748; }
    .presets-chevron { font-size: .75rem; color: #718096; transition: transform .2s; }
    .presets-chevron.open { transform: rotate(180deg); }
    .presets-body { padding: 1rem 1.25rem 1.25rem; display: none; }
    .presets-body.open { display: block; }
    .preset-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
    .preset-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .4rem .75rem;
      background: #f7fafc;
      border-radius: 6px;
      font-size: .88rem;
    }
    .preset-item-info { font-weight: 600; }
    .preset-item-cap { color: #718096; margin-left: .4rem; font-weight: 400; }
    .btn-delete-preset {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: 1.1rem;
      padding: .25rem .45rem;
      border-radius: 4px;
      transition: color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-delete-preset:hover { color: #c53030; background: #fff5f5; }
    .btn-edit-preset {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: .95rem;
      padding: .25rem .45rem;
      border-radius: 4px;
      transition: color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-edit-preset:hover { color: #2b6cb0; background: #ebf8ff; }
    .preset-item.editing { background: #ebf8ff; padding: .4rem .5rem; }
    .preset-edit-form { display: flex; gap: .4rem; align-items: center; flex: 1; flex-wrap: wrap; }
    .preset-edit-form input {
      border: 1px solid #90cdf4;
      border-radius: 5px;
      padding: .3rem .55rem;
      font-size: .88rem;
      outline: none;
      transition: border-color .15s;
    }
    .preset-edit-form input:focus { border-color: #4299e1; }
    .input-edit-name { flex: 1 1 100px; min-width: 90px; }
    .input-edit-cap { width: 70px; }
    .btn-save-preset {
      background: #2b6cb0; color: #fff; border: none; border-radius: 5px;
      padding: .3rem .7rem; font-size: .82rem; font-weight: 600; cursor: pointer;
      transition: background .15s; white-space: nowrap;
    }
    .btn-save-preset:hover { background: #2c5282; }
    .btn-cancel-edit {
      background: none; border: 1px solid #cbd5e0; border-radius: 5px; color: #718096;
      padding: .3rem .6rem; font-size: .82rem; cursor: pointer; transition: background .15s;
    }
    .btn-cancel-edit:hover { background: #edf2f7; }
    .preset-add-form { display: flex; gap: .6rem; flex-wrap: wrap; align-items: flex-start; }
    .preset-add-form input {
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: .4rem .65rem;
      font-size: .88rem;
      outline: none;
      transition: border-color .15s;
    }
    .preset-add-form input:focus { border-color: #4299e1; }
    .input-preset-name { flex: 1 1 140px; min-width: 120px; }
    .input-preset-cap { width: 80px; }
    .btn-add-preset {
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .4rem .9rem;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-add-preset:hover { background: #2c5282; }
    .presets-empty { color: #a0aec0; font-size: .88rem; font-style: italic; margin-bottom: .75rem; }

    /* ── Preset dropdown in add-car panel ───────────────────────────────── */
    .add-car-panel select {
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: .45rem .7rem;
      font-size: .9rem;
      background: #fff;
      color: #2d3748;
      outline: none;
      cursor: pointer;
      transition: border-color .15s;
    }
    .add-car-panel select:focus { border-color: #4299e1; }

    /* ── Simplified view toggle ─────────────────────────────────────────── */
    .toggle-bar {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1.25rem;
      justify-content: space-between;
    }
    .toggle-bar-left { display: flex; align-items: center; gap: .6rem; }
    .total-count { font-size: .88rem; font-weight: 600; color: #4a5568; }
    .toggle-label { font-size: .88rem; font-weight: 600; color: #4a5568; user-select: none; cursor: pointer; }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      cursor: pointer;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #cbd5e0;
      border-radius: 22px;
      transition: background .2s;
    }
    .toggle-switch input:checked + .toggle-track { background: #2b6cb0; }
    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
      transition: transform .2s;
    }
    .toggle-switch input:checked ~ .toggle-thumb { transform: translateX(16px); }

    /* ── Simplified card style ──────────────────────────────────────────── */
    .car-card.simplified {
      border-radius: 10px;
      overflow: visible;
    }
    .simplified-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem .8rem;
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #fff;
      border-radius: 8px 8px 0 0;
    }
    .simplified-families {
      padding: .3rem .8rem .4rem;
      background: #fff;
      border-radius: 0 0 8px 8px;
    }
    .simplified-family-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .25rem 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: .88rem;
    }
    .simplified-family-row:last-child { border-bottom: none; }
    .simplified-family-name { font-weight: 600; }
    .simplified-count-control {
      display: flex;
      align-items: center;
      gap: 0;
      margin-left: auto;
      margin-right: 1rem;
    }
    .count-step-btn {
      width: 2rem;
      height: 2rem;
      border: 1px solid #cbd5e0;
      background: #f7fafc;
      color: #4a5568;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: background .15s, color .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .count-step-btn:hover { background: #e2e8f0; color: #2d3748; }
    .count-step-btn:active { background: #cbd5e0; }
    .count-step-btn:disabled { opacity: .35; cursor: not-allowed; }
    .count-step-btn.minus { border-radius: 6px 0 0 6px; border-right: none; }
    .count-step-btn.plus  { border-radius: 0 6px 6px 0; border-left: none; }
    .simplified-count-input {
      width: 42px;
      border: 1px solid #cbd5e0;
      border-radius: 0;
      padding: .15rem .3rem;
      font-size: .88rem;
      font-weight: 600;
      text-align: center;
      color: #4a5568;
      outline: none;
      height: 2rem;
      transition: border-color .15s;
      -moz-appearance: textfield;
    }
    .simplified-count-input::-webkit-inner-spin-button,
    .simplified-count-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .simplified-count-input:focus { border-color: #4299e1; z-index: 1; position: relative; }
    .simplified-count-input.input-error { border-color: #c53030; background: #fff5f5; }
  </style>
</head>
<body>

<header>
  <h1>🚗 Car Group Organizer</h1>
  <button class="btn-clear" onclick="clearSession()">Clear &amp; Start Over</button>
</header>

<main>
  <!-- Preset cars management panel -->
  <div class="presets-panel">
    <div class="presets-toggle-header" id="presetsHeader" onclick="togglePresetsPanel()">
      <h2>Preset Cars</h2>
      <span class="presets-chevron" id="presetsChevron">▼</span>
    </div>
    <div class="presets-body" id="presetsBody">
      <div class="preset-list" id="presetList"></div>
      <div class="preset-add-form">
        <input class="input-preset-name" type="text" id="presetNameInput" placeholder="Preset name (e.g. Dad's Van)" />
        <input class="input-preset-cap" type="number" id="presetCapInput" placeholder="Seats" min="1" max="20" />
        <button class="btn-add-preset" onclick="handleAddPreset()">Save Preset</button>
        <span class="form-error" id="presetErr"></span>
      </div>
    </div>
  </div>

  <div class="add-car-panel">
    <label>Add car:</label>
    <select id="presetSelect" onchange="handlePresetSelect(this.value)">
      <option value="">— or pick a preset —</option>
    </select>
    <label style="margin-left:.25rem;">Capacity:</label>
    <div class="capacity-btns" id="capacityBtns"></div>
    <button class="btn-primary" id="btnAddCar" onclick="handleAddCar()" disabled>Add Car</button>
  </div>
  <div class="toggle-bar">
    <div class="toggle-bar-left">
      <label class="toggle-switch" title="Simplified view">
        <input type="checkbox" id="simplifiedToggle" onchange="handleToggleChange(this.checked)" />
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
      <span class="toggle-label" onclick="document.getElementById('simplifiedToggle').click()">Simplified view</span>
    </div>
    <span class="total-count" id="totalCount"></span>
  </div>
  <div id="groupsContainer"></div>
</main>

<script>
  const STORAGE_KEY = 'carGroups';
  const SIMPLIFIED_KEY = 'simplifiedView';
  const PRESETS_KEY = 'carPresets';
  const CAPACITIES = [2, 4, 5, 6, 7, 8];
  let selectedCapacity = null;
  let selectedPresetId = null;

  function loadSimplified() {
    try { return JSON.parse(localStorage.getItem(SIMPLIFIED_KEY)) === true; }
    catch { return false; }
  }

  function saveSimplified(val) {
    localStorage.setItem(SIMPLIFIED_KEY, JSON.stringify(val));
  }

  function handleToggleChange(checked) {
    saveSimplified(checked);
    render();
  }

  // Game of Life car colors: body, dark accent, light bg, text
  const LIFE_CARS = [
    { body: '#f56565', dark: '#9b2c2c', light: '#fff5f5', text: '#63171b' },
    { body: '#4299e1', dark: '#2a4365', light: '#ebf8ff', text: '#1a365d' },
    { body: '#f6c90e', dark: '#744210', light: '#fffff0', text: '#5f370e' },
    { body: '#48bb78', dark: '#22543d', light: '#f0fff4', text: '#1c4532' },
    { body: '#ed8936', dark: '#7b341e', light: '#fffaf0', text: '#652b19' },
    { body: '#ed64a6', dark: '#702459', light: '#fff5f7', text: '#521b41' },
  ];

  // Peg colors — one color family per passenger group
  const PEG_COLORS = [
    '#f687b3', // pink
    '#63b3ed', // sky blue
    '#9ae6b4', // mint
    '#faf089', // yellow
    '#d6bcfa', // lavender
    '#fbd38d', // peach
    '#fc8181', // salmon
    '#76e4f7', // cyan
  ];

  // ── Presets state ────────────────────────────────────────────────────────

  function loadPresets() {
    try { return JSON.parse(localStorage.getItem(PRESETS_KEY)) || []; }
    catch { return []; }
  }

  function savePresets(presets) {
    localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
  }

  function handleAddPreset() {
    const nameEl = document.getElementById('presetNameInput');
    const capEl = document.getElementById('presetCapInput');
    const errEl = document.getElementById('presetErr');
    const name = nameEl.value.trim();
    const capacity = parseInt(capEl.value, 10);
    errEl.textContent = '';
    if (!name) { errEl.textContent = 'Enter a preset name.'; nameEl.focus(); return; }
    if (!capacity || capacity < 1) { errEl.textContent = 'Enter a valid seat count.'; capEl.focus(); return; }
    const presets = loadPresets();
    if (presets.some(p => p.name.toLowerCase() === name.toLowerCase())) {
      errEl.textContent = 'A preset with that name already exists.'; nameEl.focus(); return;
    }
    presets.push({ id: uid(), name, capacity });
    savePresets(presets);
    nameEl.value = '';
    capEl.value = '';
    renderPresets();
  }

  let editingPresetId = null;

  function startEditPreset(id) {
    editingPresetId = id;
    renderPresets();
    document.getElementById(`edit-name-${id}`)?.focus();
  }

  function cancelEditPreset() {
    editingPresetId = null;
    renderPresets();
  }

  function saveEditPreset(id) {
    const nameEl = document.getElementById(`edit-name-${id}`);
    const capEl = document.getElementById(`edit-cap-${id}`);
    const errEl = document.getElementById(`edit-err-${id}`);
    const name = nameEl.value.trim();
    const capacity = parseInt(capEl.value, 10);
    errEl.textContent = '';
    if (!name) { errEl.textContent = 'Name required.'; nameEl.focus(); return; }
    if (!capacity || capacity < 1) { errEl.textContent = 'Valid seat count required.'; capEl.focus(); return; }
    const presets = loadPresets();
    if (presets.some(p => p.id !== id && p.name.toLowerCase() === name.toLowerCase())) {
      errEl.textContent = 'A preset with that name already exists.'; nameEl.focus(); return;
    }
    const preset = presets.find(p => p.id === id);
    if (!preset) return;
    preset.name = name;
    preset.capacity = capacity;
    savePresets(presets);
    editingPresetId = null;
    renderPresets();
  }

  function deletePreset(id) {
    savePresets(loadPresets().filter(p => p.id !== id));
    if (selectedPresetId === id) {
      selectedPresetId = null;
      selectedCapacity = null;
      document.getElementById('btnAddCar').disabled = true;
      document.querySelectorAll('.capacity-btn').forEach(b => b.classList.remove('selected'));
    }
    renderPresets();
  }

  function handlePresetSelect(id) {
    const presets = loadPresets();
    const preset = presets.find(p => p.id === id);
    if (!preset) {
      selectedPresetId = null;
      return;
    }
    selectedPresetId = preset.id;
    selectCapacity(preset.capacity);
  }

  function togglePresetsPanel() {
    const body = document.getElementById('presetsBody');
    const header = document.getElementById('presetsHeader');
    const chevron = document.getElementById('presetsChevron');
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    header.classList.toggle('open', !isOpen);
    chevron.classList.toggle('open', !isOpen);
  }

  function renderPresets() {
    const presets = loadPresets();
    const listEl = document.getElementById('presetList');
    const selectEl = document.getElementById('presetSelect');

    if (listEl) {
      listEl.innerHTML = presets.length === 0
        ? '<p class="presets-empty">No presets yet. Add one below.</p>'
        : presets.map(p => {
          if (p.id === editingPresetId) {
            return `
              <div class="preset-item editing">
                <div class="preset-edit-form">
                  <input class="input-edit-name" id="edit-name-${p.id}" type="text" value="${esc(p.name)}" placeholder="Name" />
                  <input class="input-edit-cap" id="edit-cap-${p.id}" type="number" min="1" max="20" value="${p.capacity}" placeholder="Seats" />
                  <button class="btn-save-preset" onclick="saveEditPreset('${p.id}')">Save</button>
                  <button class="btn-cancel-edit" onclick="cancelEditPreset()">Cancel</button>
                  <span class="form-error" id="edit-err-${p.id}"></span>
                </div>
              </div>
            `;
          }
          return `
            <div class="preset-item">
              <span class="preset-item-info">${esc(p.name)}<span class="preset-item-cap">(${p.capacity} seats)</span></span>
              <div style="display:flex;gap:.2rem;">
                <button class="btn-edit-preset" title="Edit preset" onclick="startEditPreset('${p.id}')">✎</button>
                <button class="btn-delete-preset" title="Delete preset" onclick="deletePreset('${p.id}')">✕</button>
              </div>
            </div>
          `;
        }).join('');
    }

    if (selectEl) {
      const usedPresetIds = new Set(loadState().map(g => g.presetId).filter(Boolean));
      const current = selectEl.value;
      selectEl.innerHTML = '<option value="">— or pick a preset —</option>' +
        presets.map(p => {
          const used = usedPresetIds.has(p.id);
          return `<option value="${p.id}" ${p.id === current ? 'selected' : ''} ${used ? 'disabled' : ''}>${esc(p.name)} (${p.capacity} seats)${used ? ' — already added' : ''}</option>`;
        }).join('');
      if (usedPresetIds.has(current) && current !== '') {
        selectEl.value = '';
      }
    }
  }

  // ── State ────────────────────────────────────────────────────────────────

  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveState(groups) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(groups));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // ── Mutations ────────────────────────────────────────────────────────────

  function addGroup(capacity, name, presetId) {
    const groups = loadState();
    groups.push({ id: uid(), capacity, name: name || null, presetId: presetId || null, passengers: [] });
    saveState(groups);
    render();
    renderPresets();
  }

  function addPassenger(groupId, lastName, count) {
    const groups = loadState();
    const group = groups.find(g => g.id === groupId);
    if (!group) return null;
    const used = group.passengers.reduce((s, p) => s + p.count, 0);
    if (used + count > group.capacity) return 'over';
    group.passengers.push({ lastName: lastName.trim(), count });
    saveState(groups);
    render();
    return 'ok';
  }

  function removePassenger(groupId, idx) {
    const groups = loadState();
    const group = groups.find(g => g.id === groupId);
    if (!group) return;
    group.passengers.splice(idx, 1);
    saveState(groups);
    render();
  }

  function stepPassengerCount(groupId, idx, delta) {
    const groups = loadState();
    const group = groups.find(g => g.id === groupId);
    if (!group) return;
    const othersUsed = group.passengers.reduce((s, p, i) => i !== idx ? s + p.count : s, 0);
    const newCount = group.passengers[idx].count + delta;
    if (newCount < 1 || othersUsed + newCount > group.capacity) return;
    group.passengers[idx].count = newCount;
    saveState(groups);
    render();
  }

  function updatePassengerCount(groupId, idx, inputEl) {
    const groups = loadState();
    const group = groups.find(g => g.id === groupId);
    if (!group) return;
    const newCount = parseInt(inputEl.value, 10);
    const othersUsed = group.passengers.reduce((s, p, i) => i !== idx ? s + p.count : s, 0);
    if (!newCount || newCount < 1 || othersUsed + newCount > group.capacity) {
      inputEl.classList.add('input-error');
      inputEl.value = group.passengers[idx].count;
      setTimeout(() => { inputEl.classList.remove('input-error'); inputEl.value = group.passengers[idx].count; }, 800);
      return;
    }
    inputEl.classList.remove('input-error');
    group.passengers[idx].count = newCount;
    saveState(groups);
    render();
  }

  function removeGroup(groupId) {
    const groups = loadState().filter(g => g.id !== groupId);
    saveState(groups);
    render();
    renderPresets();
  }

  function clearSession() {
    if (!confirm('Clear all car groups and start a new session?')) return;
    localStorage.removeItem(STORAGE_KEY);
    render();
    // simplified view toggle persists intentionally
  }

  // ── Capacity selector ────────────────────────────────────────────────────

  function initCapacityBtns() {
    const wrap = document.getElementById('capacityBtns');
    wrap.innerHTML = CAPACITIES.map(c =>
      `<button class="capacity-btn" data-cap="${c}" onclick="selectCapacity(${c})">${c}</button>`
    ).join('');
  }

  function selectCapacity(cap) {
    selectedCapacity = cap;
    document.querySelectorAll('.capacity-btn').forEach(b => {
      b.classList.toggle('selected', +b.dataset.cap === cap);
    });
    document.getElementById('btnAddCar').disabled = false;
  }

  function handleAddCar() {
    if (!selectedCapacity) return;
    let presetName = null;
    if (selectedPresetId) {
      const preset = loadPresets().find(p => p.id === selectedPresetId);
      if (preset) presetName = preset.name;
    }
    addGroup(selectedCapacity, presetName, selectedPresetId);
    selectedCapacity = null;
    selectedPresetId = null;
    document.querySelectorAll('.capacity-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('btnAddCar').disabled = true;
    document.getElementById('presetSelect').value = '';
  }

  // ── SVG helpers ──────────────────────────────────────────────────────────

  function carSVG(body, dark) {
    // Side-view Game of Life style car
    return `<svg class="life-car-svg" viewBox="0 0 320 112" xmlns="http://www.w3.org/2000/svg">
      <!-- Road shadow -->
      <ellipse cx="160" cy="108" rx="148" ry="6" fill="rgba(0,0,0,0.25)"/>
      <!-- Car body -->
      <rect x="12" y="54" width="296" height="42" rx="11" fill="${body}"/>
      <!-- Body lower shadow -->
      <rect x="12" y="80" width="296" height="16" rx="11" fill="rgba(0,0,0,0.1)"/>
      <!-- Cabin roof -->
      <path d="M82,54 Q90,14 112,11 L208,11 Q230,14 238,54 Z" fill="${body}"/>
      <!-- Cabin roof highlight -->
      <path d="M82,54 Q90,14 112,11 L208,11 Q230,14 238,54 Z" fill="rgba(255,255,255,0.12)"/>
      <!-- Left window -->
      <path d="M97,52 Q104,22 118,17 L154,17 L154,52 Z" fill="rgba(180,235,255,0.55)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <!-- Right window -->
      <path d="M166,52 L166,17 L202,17 Q216,22 223,52 Z" fill="rgba(180,235,255,0.55)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <!-- B-pillar -->
      <rect x="154" y="16" width="12" height="37" fill="${body}" opacity="0.9"/>
      <!-- Body highlight stripe -->
      <rect x="14" y="56" width="292" height="5" rx="2" fill="rgba(255,255,255,0.22)"/>
      <!-- Left wheel well -->
      <ellipse cx="83" cy="96" rx="30" ry="12" fill="rgba(0,0,0,0.18)"/>
      <!-- Right wheel well -->
      <ellipse cx="237" cy="96" rx="30" ry="12" fill="rgba(0,0,0,0.18)"/>
      <!-- Wheels -->
      <circle cx="83" cy="94" r="20" fill="#1a202c"/>
      <circle cx="237" cy="94" r="20" fill="#1a202c"/>
      <!-- Tire highlight -->
      <circle cx="83" cy="94" r="10" fill="#4a5568"/>
      <circle cx="237" cy="94" r="10" fill="#4a5568"/>
      <!-- Hub caps -->
      <circle cx="83" cy="94" r="5" fill="#a0aec0"/>
      <circle cx="237" cy="94" r="5" fill="#a0aec0"/>
      <!-- Headlight -->
      <ellipse cx="299" cy="67" rx="10" ry="7" fill="rgba(255,255,200,0.9)"/>
      <ellipse cx="299" cy="67" rx="6" ry="4" fill="rgba(255,255,255,0.95)"/>
      <!-- Taillight -->
      <ellipse cx="21" cy="67" rx="8" ry="6" fill="rgba(255,60,60,0.85)"/>
      <!-- Front bumper -->
      <rect x="303" y="74" width="9" height="12" rx="3" fill="${dark}"/>
      <!-- Rear bumper -->
      <rect x="8" y="74" width="9" height="12" rx="3" fill="${dark}"/>
      <!-- Door line -->
      <line x1="160" y1="56" x2="160" y2="93" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
      <!-- Side trim stripe -->
      <rect x="14" y="72" width="292" height="3" rx="1" fill="rgba(255,255,255,0.18)"/>
    </svg>`;
  }

  function pegSVG(color) {
    // Game of Life person peg: round head + tapered body
    const shadow = 'rgba(0,0,0,0.2)';
    return `<svg class="peg-svg" width="17" height="30" viewBox="0 0 17 30" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8.5" cy="6" r="5.5" fill="${color}" stroke="${shadow}" stroke-width="1"/>
      <circle cx="7" cy="4.5" r="2" fill="rgba(255,255,255,0.3)"/>
      <path d="M4,11 Q4.5,10 8.5,10 Q12.5,10 13,11 L12,26 Q10,28 8.5,28 Q7,28 5,26 Z" fill="${color}" stroke="${shadow}" stroke-width="1"/>
      <path d="M4.5,11 Q5,10.5 8.5,10.5 L8.5,28 Q7,28 5,26 Z" fill="rgba(255,255,255,0.15)"/>
    </svg>`;
  }

  // ── Render ───────────────────────────────────────────────────────────────

  function render() {
    const groups = loadState();
    const simplified = loadSimplified();
    const container = document.getElementById('groupsContainer');

    document.getElementById('simplifiedToggle').checked = simplified;

    const totalPeople = groups.reduce((s, g) => s + g.passengers.reduce((ps, p) => ps + p.count, 0), 0);
    const totalEl = document.getElementById('totalCount');
    totalEl.textContent = groups.length > 0 ? `Total: ${totalPeople}` : '';

    if (groups.length === 0) {
      container.innerHTML = '<p class="empty-state">No car groups yet. Select a capacity above and click <strong>Add Car</strong> to get started.</p>';
      return;
    }

    container.innerHTML = `<div class="cars-grid">${groups.map((g, i) => simplified ? renderSimplifiedCard(g, i + 1) : renderCard(g, i + 1)).join('')}</div>`;
  }

  function renderSimplifiedCard(group, num) {
    const used = group.passengers.reduce((s, p) => s + p.count, 0);
    const remaining = group.capacity - used;
    const carTheme = LIFE_CARS[(num - 1) % LIFE_CARS.length];

    const familyRows = group.passengers.map((p, i) => {
      const othersUsed = group.passengers.reduce((s, p2, idx) => idx !== i ? s + p2.count : s, 0);
      const maxForThis = group.capacity - othersUsed;
      return `
        <div class="simplified-family-row">
          <span class="simplified-family-name">${esc(p.lastName)}</span>
          <div class="simplified-count-control">
            <button class="count-step-btn minus" onclick="stepPassengerCount('${group.id}', ${i}, -1)" ${p.count <= 1 ? 'disabled' : ''}>−</button>
            <input class="simplified-count-input" type="number" min="1" max="${maxForThis}" value="${p.count}"
              title="People count for ${esc(p.lastName)}"
              onchange="updatePassengerCount('${group.id}', ${i}, this)" />
            <button class="count-step-btn plus" onclick="stepPassengerCount('${group.id}', ${i}, 1)" ${p.count >= maxForThis ? 'disabled' : ''}>+</button>
          </div>
          <button class="btn-delete-passenger" title="Remove ${esc(p.lastName)}" onclick="removePassenger('${group.id}', ${i})">✕</button>
        </div>
      `;
    }).join('');

    const cardLabel = group.name || `Car ${num}`;
    const footerLabel = remaining === 0
      ? `${cardLabel} &mdash; Full`
      : `${cardLabel} &mdash; ${remaining} seat${remaining !== 1 ? 's' : ''} left`;

    const addForm = remaining === 0 ? '' : `
      <div class="add-passenger-form" style="background:#f7fafc;" id="form-${group.id}">
        <input class="input-name" type="text" placeholder="Name" id="name-${group.id}" />
        <input class="input-count" type="number" min="1" max="${remaining}" value="1" id="count-${group.id}" />
        <button class="btn-add-passenger" onclick="handleAddPassenger('${group.id}')">Add</button>
        <span class="form-error" id="err-${group.id}"></span>
      </div>
    `;

    return `
      <div class="car-card simplified" style="border: 2px solid ${carTheme.dark};">
        <div class="simplified-header" style="background:${carTheme.dark};">
          <span>${footerLabel}</span>
          <button class="btn-delete-car" title="Remove car" onclick="removeGroup('${group.id}')" style="color:rgba(255,255,255,.75);">🗑</button>
        </div>
        ${group.passengers.length > 0 ? `<div class="simplified-families">${familyRows}</div>` : ''}
        ${addForm}
      </div>
    `;
  }

  function renderCard(group, num) {
    const used = group.passengers.reduce((s, p) => s + p.count, 0);
    const remaining = group.capacity - used;
    const isFull = remaining === 0;
    const carTheme = LIFE_CARS[(num - 1) % LIFE_CARS.length];

    const familySections = group.passengers.map((p, i) => {
      const pegColor = PEG_COLORS[i % PEG_COLORS.length];
      const pegs = Array.from({ length: p.count }, () => pegSVG(pegColor)).join('');
      const othersUsed = group.passengers.reduce((s, p2, idx) => idx !== i ? s + p2.count : s, 0);
      const maxForThis = group.capacity - othersUsed;
      return `
        <div class="life-family">
          <div class="life-pegs">${pegs}</div>
          <div class="life-family-name" style="color:${carTheme.text}">${esc(p.lastName)}</div>
          <div class="simplified-count-control" style="margin:0;">
            <button class="count-step-btn minus" onclick="stepPassengerCount('${group.id}', ${i}, -1)" ${p.count <= 1 ? 'disabled' : ''}>−</button>
            <input class="simplified-count-input" type="number" min="1" max="${maxForThis}" value="${p.count}"
              title="People count for ${esc(p.lastName)}"
              onchange="updatePassengerCount('${group.id}', ${i}, this)" />
            <button class="count-step-btn plus" onclick="stepPassengerCount('${group.id}', ${i}, 1)" ${p.count >= maxForThis ? 'disabled' : ''}>+</button>
          </div>
          <button class="btn-delete-passenger" title="Remove ${esc(p.lastName)}" onclick="removePassenger('${group.id}', ${i})">✕</button>
        </div>
      `;
    }).join('');

    const addForm = isFull ? '' : `
      <div class="add-passenger-form" style="background:${carTheme.light};" id="form-${group.id}">
        <input class="input-name" type="text" placeholder="Name" id="name-${group.id}" />
        <input class="input-count" type="number" min="1" max="${remaining}" value="1" id="count-${group.id}" />
        <button class="btn-add-passenger" onclick="handleAddPassenger('${group.id}')">Add</button>
        <span class="form-error" id="err-${group.id}"></span>
      </div>
    `;

    const cardLabel = group.name || `Car ${num}`;
    const footerLabel = isFull
      ? `${cardLabel} &mdash; ${group.capacity} seats &mdash; All Aboard! 🎉`
      : `${cardLabel} &mdash; ${group.capacity} seats &mdash; ${remaining} seat${remaining !== 1 ? 's' : ''} remaining`;

    return `
      <div class="car-card" style="border: 2px solid ${carTheme.dark};">
        <div class="life-car-banner">
          ${carSVG(carTheme.body, carTheme.dark)}
          <button class="btn-delete-car life-delete" title="Remove car" onclick="removeGroup('${group.id}')">🗑</button>
        </div>
        ${group.passengers.length > 0 ? `
          <div class="life-passengers" style="background:${carTheme.light};">
            ${familySections}
          </div>
        ` : ''}
        ${addForm}
        <div class="life-car-footer" style="background:${carTheme.dark};">
          ${footerLabel}
        </div>
      </div>
    `;
  }

  function handleAddPassenger(groupId) {
    const nameEl = document.getElementById(`name-${groupId}`);
    const countEl = document.getElementById(`count-${groupId}`);
    const errEl = document.getElementById(`err-${groupId}`);
    const lastName = nameEl.value.trim();
    const count = parseInt(countEl.value, 10);

    errEl.textContent = '';

    if (!lastName) { errEl.textContent = 'Please enter a last name.'; nameEl.focus(); return; }
    if (!count || count < 1) { errEl.textContent = 'Enter a valid number of people.'; countEl.focus(); return; }

    const result = addPassenger(groupId, lastName, count);
    if (result === 'over') {
      const groups = loadState();
      const group = groups.find(g => g.id === groupId);
      const used = group.passengers.reduce((s, p) => s + p.count, 0);
      errEl.textContent = `Only ${group.capacity - used} seat(s) remaining.`;
    }
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ─────────────────────────────────────────────────────────────────
  initCapacityBtns();
  renderPresets();
  render();
</script>
</body>
</html>
