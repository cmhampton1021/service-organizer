<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Group Organizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    header {
      background: #2b6cb0;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }

    header h1 { font-size: 1.3rem; font-weight: 700; }

    .btn-clear {
      background: rgba(255,255,255,.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 6px;
      padding: .4rem .9rem;
      font-size: .85rem;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-clear:hover { background: rgba(255,255,255,.25); }

    main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1.5rem 12rem; }

    /* Add car panel */
    .add-car-panel {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .add-car-panel label { font-weight: 600; font-size: .95rem; white-space: nowrap; }

    .capacity-btns { display: flex; gap: .4rem; flex-wrap: wrap; }

    .capacity-btn {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 6px;
      border: 2px solid #cbd5e0;
      background: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }
    .capacity-btn.selected {
      border-color: #2b6cb0;
      background: #2b6cb0;
      color: #fff;
    }
    .capacity-btn:hover:not(.selected) { border-color: #4299e1; background: #ebf8ff; }

    .btn-primary {
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .55rem 1.2rem;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #2c5282; }
    .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }

    /* Empty state */
    .empty-state {
      text-align: center;
      color: #718096;
      padding: 3rem 1rem;
      font-size: 1rem;
    }

    /* Car cards grid */
    .cars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }

    /* ── All car cards ───────────────────────────────────────────────────── */
    .car-card {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,.18), 0 1px 4px rgba(0,0,0,.12);
    }

    .btn-delete-car {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: 1.4rem;
      line-height: 1;
      padding: .35rem .55rem;
      min-width: 2.5rem;
      min-height: 2.5rem;
      border-radius: 6px;
      transition: color .15s, background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-delete-car:hover { color: #c53030; background: rgba(255,255,255,.15); }

    /* Passenger list inside life card */
    .life-passenger-list { padding: .3rem 1rem .1rem; }
    .passenger-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .3rem 0;
      border-bottom: 1px solid rgba(0,0,0,.06);
      font-size: .9rem;
    }
    .passenger-row:last-child { border-bottom: none; }
    .passenger-name { font-weight: 600; }
    .passenger-count { color: #718096; margin-left: .3rem; }
    .btn-delete-passenger {
      background: none;
      border: none;
      color: #cbd5e0;
      cursor: pointer;
      font-size: 1.2rem;
      padding: .35rem .5rem;
      min-width: 2.5rem;
      min-height: 2.5rem;
      border-radius: 4px;
      transition: color .15s, background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-delete-passenger:hover { color: #c53030; background: #fff5f5; }

    /* Add passenger form */
    .add-passenger-form {
      padding: .6rem 1rem .9rem;
      border-top: 1px solid rgba(0,0,0,.08);
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .add-passenger-form input {
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: .4rem .65rem;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s;
      background: #fff;
    }
    .add-passenger-form input:focus { border-color: #4299e1; }
    .input-name { flex: 1 1 120px; min-width: 100px; }
    .input-count { width: 70px; }
    .btn-add-passenger {
      background: #48bb78;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .4rem .9rem;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-add-passenger:hover { background: #38a169; }
    .form-error {
      width: 100%;
      color: #c53030;
      font-size: .8rem;
      margin-top: .15rem;
    }

    /* ── Game of Life full car ───────────────────────────────────────────── */
    .car-card.is-full {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,.18), 0 1px 4px rgba(0,0,0,.12);
    }

    .life-car-banner {
      position: relative;
      background: #1b2535;
      padding: .6rem .6rem .3rem;
    }

    .life-car-svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
    }

    .btn-delete-car.life-delete {
      position: absolute;
      top: .45rem;
      right: .45rem;
      background: rgba(0,0,0,.3);
      color: rgba(255,255,255,.75);
      border-radius: 5px;
    }
    .btn-delete-car.life-delete:hover { background: rgba(180,0,0,.55); color: #fff; }

    .life-passengers {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem 1.1rem;
      padding: .9rem 1.1rem .75rem;
      justify-content: center;
    }

    .life-family {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .2rem;
    }

    .life-family .btn-delete-passenger {
      font-size: 1rem;
      color: #a0aec0;
      padding: .35rem .5rem;
      min-width: 2.5rem;
      min-height: 2.5rem;
    }
    .life-family .btn-delete-passenger:hover { color: #c53030; background: rgba(197,48,48,.08); }

    .life-pegs {
      display: flex;
      gap: 3px;
      align-items: flex-end;
    }

    .peg-svg { display: block; }

    .life-family-name {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .02em;
      text-align: center;
    }

    .life-car-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: .45rem 1rem;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #fff;
    }

    /* ── Preset cars panel ──────────────────────────────────────────────── */
    .presets-panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      margin-bottom: 1.75rem;
      overflow: hidden;
    }
    .presets-toggle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .85rem 1.25rem;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: border-color .15s;
    }
    .presets-toggle-header.open { border-color: #e2e8f0; }
    .presets-toggle-header h2 { font-size: .95rem; font-weight: 700; color: #2d3748; }
    .presets-chevron { font-size: .75rem; color: #718096; transition: transform .2s; }
    .presets-chevron.open { transform: rotate(180deg); }
    .presets-body { padding: 1rem 1.25rem 1.25rem; display: none; }
    .presets-body.open { display: block; }
    .preset-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
    .preset-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .4rem .75rem;
      background: #f7fafc;
      border-radius: 6px;
      font-size: .88rem;
    }
    .preset-item-info { font-weight: 600; }
    .preset-item-cap { color: #718096; margin-left: .4rem; font-weight: 400; }
    .btn-delete-preset {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: 1.1rem;
      padding: .25rem .45rem;
      border-radius: 4px;
      transition: color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-delete-preset:hover { color: #c53030; background: #fff5f5; }
    .btn-edit-preset {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: .95rem;
      padding: .25rem .45rem;
      border-radius: 4px;
      transition: color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-edit-preset:hover { color: #2b6cb0; background: #ebf8ff; }
    .preset-item.editing { background: #ebf8ff; padding: .4rem .5rem; }
    .preset-edit-form { display: flex; gap: .4rem; align-items: center; flex: 1; flex-wrap: wrap; }
    .preset-edit-form input {
      border: 1px solid #90cdf4;
      border-radius: 5px;
      padding: .3rem .55rem;
      font-size: .88rem;
      outline: none;
      transition: border-color .15s;
    }
    .preset-edit-form input:focus { border-color: #4299e1; }
    .input-edit-name { flex: 1 1 100px; min-width: 90px; }
    .input-edit-cap { width: 70px; }
    .btn-save-preset {
      background: #2b6cb0; color: #fff; border: none; border-radius: 5px;
      padding: .3rem .7rem; font-size: .82rem; font-weight: 600; cursor: pointer;
      transition: background .15s; white-space: nowrap;
    }
    .btn-save-preset:hover { background: #2c5282; }
    .btn-cancel-edit {
      background: none; border: 1px solid #cbd5e0; border-radius: 5px; color: #718096;
      padding: .3rem .6rem; font-size: .82rem; cursor: pointer; transition: background .15s;
    }
    .btn-cancel-edit:hover { background: #edf2f7; }
    .preset-add-form { display: flex; gap: .6rem; flex-wrap: wrap; align-items: flex-start; }
    .preset-add-form input {
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: .4rem .65rem;
      font-size: .88rem;
      outline: none;
      transition: border-color .15s;
    }
    .preset-add-form input:focus { border-color: #4299e1; }
    .input-preset-name { flex: 1 1 140px; min-width: 120px; }
    .input-preset-cap { width: 80px; }
    .btn-add-preset {
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .4rem .9rem;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-add-preset:hover { background: #2c5282; }
    .presets-empty { color: #a0aec0; font-size: .88rem; font-style: italic; margin-bottom: .75rem; }

    /* ── Preset dropdown in add-car panel ───────────────────────────────── */
    .add-car-panel select {
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: .45rem .7rem;
      font-size: .9rem;
      background: #fff;
      color: #2d3748;
      outline: none;
      cursor: pointer;
      transition: border-color .15s;
    }
    .add-car-panel select:focus { border-color: #4299e1; }

    /* ── Simplified view toggle ─────────────────────────────────────────── */
    .toggle-bar {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1.25rem;
      justify-content: space-between;
    }
    .toggle-bar-left { display: flex; align-items: center; gap: .6rem; }
    .total-count { font-size: .88rem; font-weight: 600; color: #4a5568; }
    .toggle-label { font-size: .88rem; font-weight: 600; color: #4a5568; user-select: none; cursor: pointer; }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      cursor: pointer;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #cbd5e0;
      border-radius: 22px;
      transition: background .2s;
    }
    .toggle-switch input:checked + .toggle-track { background: #2b6cb0; }
    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
      transition: transform .2s;
    }
    .toggle-switch input:checked ~ .toggle-thumb { transform: translateX(16px); }

    /* ── Simplified card style ──────────────────────────────────────────── */
    .car-card.simplified {
      border-radius: 10px;
      overflow: hidden;
    }
    .simplified-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem .8rem;
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #fff;
      border-radius: 8px 8px 0 0;
    }
    .simplified-families {
      padding: .3rem .8rem .4rem;
      background: #fff;
      border-radius: 0 0 8px 8px;
    }
    .simplified-family-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .25rem 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: .88rem;
    }
    .simplified-family-row:last-child { border-bottom: none; }
    .simplified-family-name { font-weight: 600; }
    .simplified-count-control {
      display: flex;
      align-items: center;
      gap: 0;
      margin-left: auto;
      margin-right: 1rem;
    }
    .count-step-btn {
      width: 2rem;
      height: 2rem;
      border: 1px solid #cbd5e0;
      background: #f7fafc;
      color: #4a5568;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: background .15s, color .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .count-step-btn:hover { background: #e2e8f0; color: #2d3748; }
    .count-step-btn:active { background: #cbd5e0; }
    .count-step-btn:disabled { opacity: .35; cursor: not-allowed; }
    .count-step-btn.minus { border-radius: 6px 0 0 6px; border-right: none; }
    .count-step-btn.plus  { border-radius: 0 6px 6px 0; border-left: none; }
    .simplified-count-input {
      width: 42px;
      border: 1px solid #cbd5e0;
      border-radius: 0;
      padding: .15rem .3rem;
      font-size: .88rem;
      font-weight: 600;
      text-align: center;
      color: #4a5568;
      outline: none;
      height: 2rem;
      transition: border-color .15s;
      -moz-appearance: textfield;
    }
    .simplified-count-input::-webkit-inner-spin-button,
    .simplified-count-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .simplified-count-input:focus { border-color: #4299e1; z-index: 1; position: relative; }
    .simplified-count-input.input-error { border-color: #c53030; background: #fff5f5; }

    /* ── Unassigned Groups panel ────────────────────────────────────────────── */
    .unassigned-panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      margin-bottom: 1.75rem;
      padding: 1rem 1.25rem 1.25rem;
    }
    .unassigned-heading {
      font-size: .95rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: .6rem;
    }
    .unassigned-list { margin-bottom: .5rem; }
    .unassigned-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .35rem 0;
      border-bottom: 1px solid #e2e8f0;
      flex-wrap: wrap;
    }
    .unassigned-row:last-child { border-bottom: none; }
    .unassigned-name-input {
      flex: 1 1 110px;
      min-width: 90px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: .3rem .55rem;
      font-size: .88rem;
      font-weight: 600;
      color: #2d3748;
      outline: none;
      transition: border-color .15s;
      background: #f7fafc;
    }
    .unassigned-name-input:focus { border-color: #4299e1; background: #fff; }
    .btn-assign-to-car {
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .3rem .75rem;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-assign-to-car:hover { background: #2c5282; }
    .btn-assign-to-car:disabled { background: #a0aec0; cursor: not-allowed; }
    .btn-move-passenger {
      background: none;
      border: 1px solid #cbd5e0;
      border-radius: 5px;
      color: #4a5568;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
      padding: .25rem .55rem;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn-move-passenger:hover { background: #ebf8ff; color: #2b6cb0; border-color: #90cdf4; }
    .move-controls { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
    .move-select {
      border: 1px solid #90cdf4;
      border-radius: 5px;
      padding: .28rem .45rem;
      font-size: .82rem;
      background: #fff;
      color: #2d3748;
      outline: none;
      cursor: pointer;
    }
    .btn-move-confirm {
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: .28rem .65rem;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-move-confirm:hover { background: #2c5282; }
    .btn-move-cancel {
      background: none;
      border: 1px solid #cbd5e0;
      border-radius: 5px;
      color: #718096;
      padding: .28rem .5rem;
      font-size: .82rem;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-move-cancel:hover { background: #edf2f7; }
    .add-unassigned-form {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-top: .6rem;
      padding-top: .6rem;
      border-top: 1px solid #e2e8f0;
    }
    .add-unassigned-form input {
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: .4rem .65rem;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s;
      background: #fff;
    }
    .add-unassigned-form input:focus { border-color: #4299e1; }
  </style>
</head>
<body>

<header>
  <h1>🚗 Car Group Organizer</h1>
  <button class="btn-clear" onclick="clearSession()">Clear &amp; Start Over</button>
</header>

<main>
  <!-- Preset cars management panel -->
  <div class="presets-panel">
    <div class="presets-toggle-header" id="presetsHeader" onclick="togglePresetsPanel()">
      <h2>Preset Cars</h2>
      <span class="presets-chevron" id="presetsChevron">▼</span>
    </div>
    <div class="presets-body" id="presetsBody">
      <div class="preset-list" id="presetList"></div>
      <div class="preset-add-form">
        <input class="input-preset-name" type="text" id="presetNameInput" placeholder="Preset name (e.g. Dad's Van)" />
        <input class="input-preset-cap" type="number" id="presetCapInput" placeholder="Seats" min="1" max="20" />
        <button class="btn-add-preset" onclick="handleAddPreset()">Save Preset</button>
        <span class="form-error" id="presetErr"></span>
      </div>
    </div>
  </div>

  <div class="add-car-panel">
    <label>Add car:</label>
    <select id="presetSelect" onchange="handlePresetSelect(this.value)">
      <option value="">— or pick a preset —</option>
    </select>
    <label style="margin-left:.25rem;">Capacity:</label>
    <div class="capacity-btns" id="capacityBtns"></div>
    <button class="btn-primary" id="btnAddCar" onclick="handleAddCar()" disabled>Add Car</button>
  </div>
  <div class="toggle-bar">
    <div class="toggle-bar-left">
      <label class="toggle-switch" title="Simplified view">
        <input type="checkbox" id="simplifiedToggle" onchange="handleToggleChange(this.checked)" />
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
      <span class="toggle-label" onclick="document.getElementById('simplifiedToggle').click()">Simplified view</span>
    </div>
    <span class="total-count" id="totalCount"></span>
  </div>
  <div id="unassignedContainer"></div>
  <div id="groupsContainer"></div>
</main>

<script src="app.js"></script>
</body>
</html>
